version: 2
updates:
  # Actions are SHA-pinned; Dependabot bumps the SHA and its version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"

  # The committed locks are only worth having while they are current; without
  # these, scanners report CVEs against versions no job ever installs.
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
  - package-ecosystem: composer
    directory: /test-frameworks
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"

name: Deploy

on:
  release:
    types: [ published ]

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: curl, json
          coverage: none
      - name: Validate composer.json
        run: composer validate --strict
      - name: Verify the release is publishable
        env:
          TAG: ${{ github.event.release.tag_name }}
          TARGET: ${{ github.event.release.target_commitish }}
        run: |
          if [ "$TARGET" != "master" ]; then
            echo "Releases must be cut from master; this one targets $TARGET."
            exit 1
          fi
          case "$TAG" in
            [0-9]*.[0-9]*.[0-9]*|v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Release tag must be semantic, e.g. 1.2.3"; exit 1 ;;
          esac
          # VERSION is hand-maintained and sent in the User-Agent, so it must not drift from the tag.
          sdk_version="$(sed -n "s/.*public const VERSION = '\([^']*\)'.*/\1/p" src/BlinkDebitClient.php)"
          if [ "${TAG#v}" != "$sdk_version" ]; then
            echo "Release tag $TAG does not match BlinkDebitClient::VERSION ($sdk_version); bump the constant first."
            exit 1
          fi
          echo "Releasing $TAG"

  notify_packagist:
    needs: verify
    runs-on: ubuntu-latest
    # The Packagist credentials belong to this environment rather than the
    # repository, so GitHub enforces the tag policy and reviewer approval before
    # they can be read. That guard cannot live in this file: a release runs the
    # workflow definition found on the ref being deployed, so any check written
    # here is editable by whoever controls that ref.
    environment: packagist
    permissions: {}
    steps:
      # No checkout and no third-party actions: Packagist only needs the
      # repository URL, so nothing external runs beside the token.
      - name: Notify Packagist
        # Packagist reads versions from git tags, so publishing is a metadata refresh rather than an upload.
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
          REPOSITORY_URL: https://github.com/${{ github.repository }}
        run: |
          curl --fail --silent --show-error -X POST \
            -H 'Content-Type: application/json' \
            "https://packagist.org/api/update-package?username=${PACKAGIST_USERNAME}&apiToken=${PACKAGIST_TOKEN}" \
            -d "{\"repository\":{\"url\":\"${REPOSITORY_URL}\"}}"

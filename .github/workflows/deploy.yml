name: Deploy

on:
  release:
    types: [ published ]

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    # Reject manual dispatch and any non-release trigger. The workflow must run
    # only for published releases, where the tag and ancestry validation below
    # can enforce release policy. A workflow_dispatch trigger would allow a
    # contributor to select an arbitrary ref, skip this validation (because
    # github.event.release is absent), and reach the Packagist credentials.
    if: github.event_name == 'release'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history, so origin/master is present for the ancestry check below.
          fetch-depth: 0
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: curl, json
          coverage: none
      - name: Validate composer.json
        run: composer validate --strict
      - name: Verify the release is publishable
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          # GitHub ignores the release's target_commitish once the tag exists and
          # reports the default branch instead, so it is no evidence of anything.
          # Ask git where the tagged commit actually sits.
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "Tag $TAG points at $GITHUB_SHA, which is not on master; releases must be cut from master."
            exit 1
          fi
          case "$TAG" in
            [0-9]*.[0-9]*.[0-9]*|v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Release tag must be semantic, e.g. 1.2.3"; exit 1 ;;
          esac
          # VERSION is hand-maintained and sent in the User-Agent, so it must not drift from the tag.
          sdk_version="$(sed -n "s/.*public const VERSION = '\([^']*\)'.*/\1/p" src/BlinkDebitClient.php)"
          if [ "${TAG#v}" != "$sdk_version" ]; then
            echo "Release tag $TAG does not match BlinkDebitClient::VERSION ($sdk_version); bump the constant first."
            exit 1
          fi
          echo "Releasing $TAG"

  notify_packagist:
    needs: verify
    runs-on: ubuntu-latest
    # Defence in depth: reject non-release events even if the verify job is
    # modified or bypassed. This prevents credential exposure if workflow_dispatch
    # is added to the trigger list.
    if: github.event_name == 'release'
    # PACKAGIST_USERNAME/PACKAGIST_TOKEN are environment secrets here, reachable
    # only from a release tag and only after a reviewer approves the deployment.
    # The guard has to live there rather than here: a release runs the workflow
    # definition found on the ref being deployed, so any check written in this
    # file is editable by whoever controls that ref.
    environment: packagist
    permissions: {}
    steps:
      # Redundant while a published release is the only trigger, since such a run
      # is always on a tag ref. It is kept so that adding another trigger later
      # cannot reach the Packagist credentials from a branch ref. It is not a
      # defence against a modified workflow: a tag carrying an edited copy of this
      # file passes it. The enforcing control is the protected environment above.
      # GITHUB_REF is read from the environment rather than interpolated, because
      # an expression is substituted into the script before bash parses it and the
      # tag name is chosen by whoever publishes the release.
      - name: Enforce execution from release tag only
        run: |
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            echo "SECURITY: this workflow must run from a tag (refs/tags/*), not from $GITHUB_REF"
            exit 1
          fi
          echo "Verified: running from tag $GITHUB_REF"
      # No checkout and no third-party actions: Packagist only needs the
      # repository URL, so nothing external runs beside the token.
      - name: Notify Packagist
        # Packagist reads versions from git tags, so publishing is a metadata refresh rather than an upload.
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
          REPOSITORY_URL: https://github.com/${{ github.repository }}
        run: |
          curl --fail --silent --show-error -X POST \
            -H 'Content-Type: application/json' \
            "https://packagist.org/api/update-package?username=${PACKAGIST_USERNAME}&apiToken=${PACKAGIST_TOKEN}" \
            -d "{\"repository\":{\"url\":\"${REPOSITORY_URL}\"}}"

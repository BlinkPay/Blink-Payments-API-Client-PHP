name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

# Every job only reads the checkout; nothing here writes back to the repository.
permissions:
  contents: read

jobs:
  static_analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: curl, json
          coverage: none
      - name: Cache Composer packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-composer-
      - name: Validate composer.json and the committed lock
        # Runs before the update below so --strict sees the lock as committed.
        run: composer validate --strict
      - name: Install packages
        run: composer update --no-interaction --no-progress --prefer-dist
      - name: Run PHPStan
        run: composer analyse

  build_test:
    needs: static_analysis
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every version composer.json declares (^7.4 || ^8.0), so the support
        # claim stays tested, and a deprecation in a new PHP release surfaces
        # here rather than in production.
        php-version: [ '7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5' ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php-version }}
          # apcu backs the default token cache; enabling it for the CLI lets its tests run.
          extensions: curl, json, apcu
          ini-values: apc.enable_cli=1
          coverage: none
      - name: Cache Composer packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer
          key: ${{ runner.os }}-composer-${{ matrix.php-version }}-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-composer-${{ matrix.php-version }}-
      - name: Install packages
        # The root composer.lock is committed so scanners see the dependency set,
        # but phpunit 13 pins it to PHP 8.4.1+, so the rows below that cannot
        # install from it. The matrix updates instead, which also tests every
        # version against the highest set its own runtime allows.
        run: composer update --no-interaction --no-progress --prefer-dist
      - name: Lint
        run: find src test test-integration config -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: Test
        run: vendor/bin/phpunit

  integration:
    # Drives the real Blink Debit sandbox with the organisation's test client,
    # as the Java, Node and .NET SDKs do. Not run for forks or Dependabot,
    # which cannot read the secret; where it does run, a skipped test fails
    # the job, so a missing secret cannot pass as a green build.
    if: github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    # After the unit matrix, so a red unit suite does not spend sandbox
    # consents or the token endpoint's rate budget.
    needs: [ static_analysis, build_test ]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: curl, json
          coverage: none
      - name: Cache Composer packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-composer-
      - name: Install packages
        run: composer update --no-interaction --no-progress --prefer-dist
      - name: Run the sandbox integration tests
        run: vendor/bin/phpunit --testsuite integration --fail-on-skipped
        env:
          # The suite refuses any debit URL other than the sandbox.
          BLINKPAY_DEBIT_URL: ${{ vars.DEBIT_URL }}
          BLINKPAY_CLIENT_ID: ${{ vars.CLIENT_ID }}
          BLINKPAY_CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}

  framework_glue:
    # Boots the real Laravel, Symfony and CakePHP containers against the
    # provider, bundle and plugin in src/, and runs PHPStan over that glue
    # with the frameworks installed (the main analysis job excludes it).
    needs: static_analysis
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: [ '8.3', '8.4' ]
    defaults:
      run:
        working-directory: test-frameworks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php-version }}
          extensions: curl, json, intl, mbstring
          coverage: none
      - name: Cache Composer packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer
          key: ${{ runner.os }}-composer-frameworks-${{ matrix.php-version }}-${{ hashFiles('test-frameworks/composer.json') }}
          restore-keys: ${{ runner.os }}-composer-frameworks-${{ matrix.php-version }}-
      - name: Install frameworks
        run: composer update --no-interaction --no-progress --prefer-dist
      - name: Analyse the framework glue
        run: composer analyse
      - name: Boot the containers
        run: composer test

  sonar:
    needs: [ build_test, framework_glue ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history so SonarCloud can attribute new code accurately
          fetch-depth: 0
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: curl, json
          coverage: pcov
      - name: Cache SonarCloud packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Cache Composer packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-composer-
      - name: Install packages
        run: composer update --no-interaction --no-progress --prefer-dist
      - name: Test with coverage
        # Clover for Sonar, Cobertura for Aikido, which reads LCOV or Cobertura only.
        run: vendor/bin/phpunit --coverage-filter src --coverage-clover build/coverage.xml --coverage-cobertura build/cobertura.xml --log-junit build/junit.xml
      - name: Store the Cobertura report for the Aikido upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: build/cobertura.xml
          retention-days: 1
      - name: Run Sonar
        # Gates the build. Skipped on pull requests from forks, which cannot read the token.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: sonarsource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        with:
          projectBaseDir: .
          args: >
            -Dsonar.projectKey=blink-debit-api-client-php
            -Dsonar.organization=blinkpay
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  # Aikido's PR check waits 30 minutes for a report tied to the PR head commit,
  # which the action reads from the event payload. Kept as its own job so the
  # OIDC token grant stays off the test jobs, as Aikido recommends. Fork PRs
  # cannot mint an OIDC token, so they are skipped.
  aikido-coverage:
    if: ${{ !github.event.pull_request.head.repo.fork }}
    needs: sonar
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the Cobertura report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
          path: build
      - name: Upload coverage to Aikido
        uses: AikidoSec/code-coverage-github-action@e0637ab96a560c1ab11671c41a4a4668075bae0e # v2.1.1
        with:
          region: au
          # The action tells the format from the filename, so keep "cobertura" in it.
          file-paths: build/cobertura.xml
